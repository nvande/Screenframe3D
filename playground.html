<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenframe3D Demo</title>
    <!-- Add Three.js and GLTFLoader -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: #f0f0f0;
        }
        .demo-section {
            margin-bottom: 40px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
        }
        h2 {
            margin-top: 0;
        }
        .device-container {
            width: 100%;
            height: 500px;
            margin: 20px 0;
            border: 2px dashed #666;
            border-radius: 4px;
            resize: both;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.1);
            position: relative;
        }
        .device-container::after {
            content: '↔ Drag to resize';
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
        }
        .controls {
            margin: 20px 0;
            padding: 15px;
            background: #f8f8f8;
            border-radius: 4px;
        }
        .controls label {
            display: block;
            margin-bottom: 10px;
        }
        .controls input[type="range"] {
            width: 200px;
            margin-right: 10px;
        }
        .controls span {
            font-family: monospace;
            color: #666;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
            "three/examples/jsm/loaders/GLTFLoader": "https://unpkg.com/three@0.162.0/examples/jsm/loaders/GLTFLoader.js"
        }
    }
    </script>
  <script type="module" crossorigin src="/Screenframe3D/assets/playground-0c23cf84.js"></script>
  <link rel="modulepreload" crossorigin href="/Screenframe3D/assets/initDeviceShowcase-92af8a1c.js">
</head>
<body>
    <div class="demo-section">
        <h2>Vanilla JavaScript Demo</h2>
        <p style="margin-top:-8px;color:#666;font-size:14px;">
            Playground for knobs.
            <a href="./">Open the fake launch page →</a>
        </p>
        <div class="controls">
            <label>
                Tilt Effect:
                <input type="checkbox" id="tilt-enabled" checked>
            </label>
            <label>
                Field of View:
                <input type="range" id="fov" min="30" max="120" step="1" value="75">
                <span id="fov-value">75°</span>
            </label>
            <label>
                Spring Effect:
                <input type="checkbox" id="spring-enabled" checked>
            </label>
            <label>
                Spring Strength:
                <input type="range" id="spring-strength" min="0.01" max="0.2" step="0.01" value="0.05">
                <span id="spring-strength-value">0.05</span>
            </label>
            <label>
                Spring Damping:
                <input type="range" id="spring-damping" min="0.5" max="0.99" step="0.01" value="0.9">
                <span id="spring-damping-value">0.9</span>
            </label>
            <label>
                RotX:
                <input type="range" id="tilt-x" min="-2" max="2" step="0.01" value="0">
                <span id="tilt-x-value">0</span>
            </label>
            <label>
                RotY:
                <input type="range" id="tilt-y" min="-2" max="2" step="0.01" value="0">
                <span id="tilt-y-value">0</span>
            </label>
            <label>
                RotZ:
                <input type="range" id="tilt-z" min="-2" max="2" step="0.01" value="0">
                <span id="tilt-z-value">0</span>
            </label>
        </div>
        <div id="vanilla-container" class="device-container"></div>
    </div>

    
</body>
</html>
